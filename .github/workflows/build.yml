name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit test + build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk PapaMama.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PapaMama-apk
          path: PapaMama.apk
      - name: Publish release (unduh langsung dari HP)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest PapaMama.apk --target "${{ github.sha }}" \
            --title "PapaMama Multi-Operator (build ${{ github.run_number }})" \
            --notes "Unduh **PapaMama.apk** di bawah ini langsung dari HP Android, lalu buka untuk memasang. Build otomatis dari commit ${{ github.sha }}."
      - name: Push APK to builds branch
        run: |
          mkdir pub && cp PapaMama.apk pub/ && cd pub
          git init -q && git checkout -q -b builds && git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "APK build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PapaMama-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app on emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p shots
            adb install -r PapaMama.apk
            adb shell pm grant id.papamama.app android.permission.POST_NOTIFICATIONS
            adb shell am start -W -n id.papamama.app/.MainActivity --ez demo true
            sleep 8
            adb exec-out screencap -p > shots/1-beranda.png
            adb shell am start -W -n id.papamama.app/.MainActivity --es line demo-kakak
            sleep 5
            adb exec-out screencap -p > shots/2-detail-watch.png
            adb shell am start -W -n id.papamama.app/.MainActivity --es line demo-adik --es act buy
            sleep 5
            adb exec-out screencap -p > shots/3-beli.png
            adb shell am start -W -n id.papamama.app/.MainActivity --es line demo-kakak --es act update
            sleep 5
            adb exec-out screencap -p > shots/4-update.png
            adb shell cmd statusbar expand-notifications
            sleep 4
            adb exec-out screencap -p > shots/5-notifikasi.png
            adb shell cmd statusbar collapse
            adb shell am start -W -n id.papamama.app/.MainActivity --es screen settings
            sleep 4
            adb exec-out screencap -p > shots/6-pengaturan.png
            adb logcat -d -t 400 > shots/logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
      - name: Push screenshots to builds branch
        if: always()
        run: |
          git clone -q --depth 1 -b builds "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pub
          mkdir -p pub/screenshots && cp shots/* pub/screenshots/ || true
          cd pub && git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots build ${{ github.run_number }}" || true
          git push -q origin builds
